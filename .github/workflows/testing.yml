name: Python Testing

on:
  push:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install packages
      run: |
        pip install -r requirements.txt

    - name: Run Decision Tree
      run: |
        python train.py

    - name: Run Kernel Ridge
      run: |
        python train2.py